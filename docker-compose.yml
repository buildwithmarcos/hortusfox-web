services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    image: hortusfox-web:local
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - app_images:/var/www/html/public/img
      - app_attachments:/var/www/html/public/attachments
      - app_logs:/var/www/html/app/logs
      - app_backup:/var/www/html/public/backup
      - app_themes:/var/www/html/public/themes
      - app_migrate:/var/www/html/app/migrations
    environment:
      APP_ADMIN_EMAIL: "${APP_ADMIN_EMAIL:?set APP_ADMIN_EMAIL in .env}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in .env}"
      APP_TIMEZONE: "${APP_TIMEZONE:-UTC}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APACHE_SERVER_NAME: "${APACHE_SERVER_NAME:-localhost}"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-hortusfox}"
      DB_USERNAME: "${DB_USERNAME:-hortusfox}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      DB_CHARSET: "utf8mb4"
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}"
      MARIADB_DATABASE: "${DB_DATABASE:-hortusfox}"
      MARIADB_USER: "${DB_USERNAME:-hortusfox}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_images:
  app_attachments:
  app_logs:
  app_backup:
  app_themes:
  app_migrate:
